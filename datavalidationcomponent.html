<script>
// =====================================================
// DATAVERSE CONNECTION & API  (reused from Bulk Operations tool)
// =====================================================
const ORG_URL = window.location.origin;
let _isLive = false;

function apiH() { return { "OData-MaxVersion":"4.0","OData-Version":"4.0","Accept":"application/json" }; }
function apiHRead() { return { ...apiH(), "Prefer":'odata.include-annotations="*"' }; }

async function dvFetch(url, options = {}) {
  const opts = { ...options, headers: { ...apiHRead(), ...(options.headers || {}) }, credentials: "include" };
  const r = await fetch(url, opts);
  if (!r.ok) { const err = await r.json().catch(()=>({})); throw new Error(err?.error?.message || `${r.status} ${r.statusText}`); }
  if (r.status === 204) return null;
  return r.json();
}

// =====================================================
// METADATA
// =====================================================
let ALL_ENTITIES = [];
let ENTITY_ATTRS = {};                // logicalName -> [attr, ...]
const _lookupTargetCache = {};        // "entity.field" -> targetInfo
const _childRelCache = {};            // logicalName -> [oneToMany rel, ...]

const EDITABLE_TYPES = new Set(['StringType','MemoType','IntegerType','BigIntType','DoubleType','DecimalType','MoneyType','DateTimeType','BooleanType','PicklistType','StateType','StatusType','LookupType','CustomerType','OwnerType','UniqueidentifierType','EntityNameType','ManagedPropertyType','MultiSelectPicklistType','FileType','ImageType']);
const CHOICE_TYPES = new Set(['PicklistType','StateType','StatusType','BooleanType','MultiSelectPicklistType']);
const LOOKUP_TYPES = new Set(['LookupType','CustomerType','OwnerType']);

async function loadAllEntities() {
  showLoading('Discovering tables…');
  try {
    const s = "LogicalName,DisplayName,EntitySetName,IsCustomEntity,ObjectTypeCode,PrimaryIdAttribute,PrimaryNameAttribute,IsValidForAdvancedFind";
    const r = await fetch(`${ORG_URL}/api/data/v9.2/EntityDefinitions?$select=${s}`, { headers: apiH(), credentials: "include" });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error?.message || `${r.status}`);
    const data = await r.json();
    ALL_ENTITIES = (data.value || [])
      .filter(e => e.IsValidForAdvancedFind !== false && e.EntitySetName)
      .sort((a,b) => (a.DisplayName?.UserLocalizedLabel?.Label||a.LogicalName).localeCompare(b.DisplayName?.UserLocalizedLabel?.Label||b.LogicalName))
      .map(e => ({
        logicalName: e.LogicalName,
        displayName: e.DisplayName?.UserLocalizedLabel?.Label || e.LogicalName,
        entitySetName: e.EntitySetName, isCustom: e.IsCustomEntity,
        primaryIdAttr: e.PrimaryIdAttribute, primaryNameAttr: e.PrimaryNameAttribute,
        objectTypeCode: e.ObjectTypeCode,
      }));
    _isLive = true;
    showStatus('success', `Connected — ${ALL_ENTITIES.length} tables found`);
    populateEntityDropdown(); hideLoading();
  } catch(e) {
    _isLive = false; loadMockData(); hideLoading();
    showStatus('warn', `Offline demo mode — ${e.message}`);
  }
}

async function loadEntityAttributes(logicalName) {
  if (ENTITY_ATTRS[logicalName]?.length) return ENTITY_ATTRS[logicalName];
  if (!_isLive) return ENTITY_ATTRS[logicalName] || [];
  try {
    const url = `${ORG_URL}/api/data/v9.2/EntityDefinitions(LogicalName='${logicalName}')/Attributes?$select=LogicalName,DisplayName,AttributeTypeName,IsValidForRead`;
    const r = await fetch(url, { headers: apiH(), credentials: "include" });
    if (!r.ok) throw new Error(`${r.status}`);
    const data = await r.json();
    const attrs = (data.value || [])
      .filter(a => { const t = a.AttributeTypeName?.Value||''; return EDITABLE_TYPES.has(t) && a.IsValidForRead !== false && !a.LogicalName.endsWith('_base'); })
      .sort((a,b) => a.LogicalName.localeCompare(b.LogicalName))
      .map(a => ({ logicalName: a.LogicalName, displayName: a.DisplayName?.UserLocalizedLabel?.Label || a.LogicalName, type: a.AttributeTypeName?.Value||'StringType' }));
    ENTITY_ATTRS[logicalName] = attrs;
    await Promise.all(attrs.filter(a => LOOKUP_TYPES.has(a.type)).map(f => loadLookupTargets(logicalName, f)));
    return attrs;
  } catch(e) { console.error('[loadEntityAttributes]', logicalName, e.message); ENTITY_ATTRS[logicalName] = []; return []; }
}

async function loadLookupTargets(entityName, fieldMeta) {
  const ck = `${entityName}.${fieldMeta.logicalName}`;
  if (_lookupTargetCache[ck]) { fieldMeta.lookupTarget = _lookupTargetCache[ck]; return; }
  try {
    const r = await fetch(`${ORG_URL}/api/data/v9.2/EntityDefinitions(LogicalName='${entityName}')/Attributes/Microsoft.Dynamics.CRM.LookupAttributeMetadata?$select=LogicalName,Targets&$filter=LogicalName eq '${fieldMeta.logicalName}'`, { headers: apiH(), credentials: "include" });
    if (!r.ok) { fieldMeta.lookupTarget = null; return; }
    const d = await r.json(); const attr = (d.value||[])[0]; const targets = attr?.Targets||[];
    if (!targets.length) { fieldMeta.lookupTarget = null; return; }
    const info = { targets, targetEntity: targets[0] };
    _lookupTargetCache[ck] = info; fieldMeta.lookupTarget = info;
  } catch(e) { fieldMeta.lookupTarget = null; }
}

// Discover 1:N relationships — child records that point TO this entity via a lookup
async function loadChildRelationships(logicalName) {
  if (_childRelCache[logicalName]) return _childRelCache[logicalName];
  if (!_isLive) { _childRelCache[logicalName] = []; return []; }
  try {
    const url = `${ORG_URL}/api/data/v9.2/EntityDefinitions(LogicalName='${logicalName}')/OneToManyRelationships?$select=ReferencingEntity,ReferencingAttribute,ReferencedAttribute,ReferencedEntityNavigationPropertyName,SchemaName,IsCustomRelationship`;
    const r = await fetch(url, { headers: apiH(), credentials: "include" });
    if (!r.ok) throw new Error(`${r.status}`);
    const d = await r.json();
    // Hide noisy system/audit relationships that bury the useful ones
    const SKIP_CHILD = new Set(['asyncoperation','bulkdeletefailure','duplicaterecord','principalobjectattributeaccess','sharepointdocumentlocation','syncerror','processsession','annotation','activitypointer','activityparty','postregarding','postfollow','expanderevent','mailboxtrackingfolder','sharepointdocument','userentityinstancedata','userentityuisettings','recordfilter','msdyn_componentlayer','ribbonmetadatatoprocess']);
    const rels = (d.value||[])
      .filter(rel => rel.ReferencingEntity && !SKIP_CHILD.has(rel.ReferencingEntity))
      .map(rel => {
        const childEntity = ALL_ENTITIES.find(e => e.logicalName === rel.ReferencingEntity);
        return {
          schemaName: rel.SchemaName,
          childEntity: rel.ReferencingEntity,
          childEntitySet: childEntity?.entitySetName || null,
          childDisplay: childEntity?.displayName || rel.ReferencingEntity,
          childPrimaryName: childEntity?.primaryNameAttr || null,
          fkField: rel.ReferencingAttribute,        // lookup attr on child
          isCustom: rel.IsCustomRelationship,
        };
      })
      .filter(rel => rel.childEntitySet) // must be queryable
      .sort((a,b) => Number(b.isCustom) - Number(a.isCustom) || a.childDisplay.localeCompare(b.childDisplay));
    _childRelCache[logicalName] = rels;
    return rels;
  } catch(e) { console.error('[loadChildRelationships]', e.message); _childRelCache[logicalName] = []; return []; }
}

// =====================================================
// VIEWS (saved queries) — ported from Bulk Operations tool
// =====================================================
const _viewsCache = {}; // logicalName -> [{id, name, fetchxml, type, isDefault}]
let currentView = '';   // savedqueryid / userqueryid, or '' for All records

async function loadViews(logicalName) {
  if (_viewsCache[logicalName]) return _viewsCache[logicalName];
  if (!_isLive) { _viewsCache[logicalName] = window._mockViews?.[logicalName] || []; return _viewsCache[logicalName]; }
  const views = [];
  try {
    // querytype 0 = main views, 4 = quick find
    const sysFilter = encodeURIComponent(`returnedtypecode eq '${logicalName}' and statecode eq 0 and (querytype eq 0 or querytype eq 4)`);
    const r = await fetch(`${ORG_URL}/api/data/v9.2/savedqueries?$filter=${sysFilter}&$select=name,savedqueryid,fetchxml,querytype,isdefault&$orderby=name asc`, { headers: apiH(), credentials: 'include' });
    if (r.ok) { const d = await r.json(); (d.value||[]).filter(v => v.querytype === 0).forEach(v => views.push({ id: v.savedqueryid, name: v.name, fetchxml: v.fetchxml, type: 'system', isDefault: v.isdefault })); }
  } catch(e) { console.warn('[Views] savedqueries error:', e); }
  try {
    const userFilter = encodeURIComponent(`returnedtypecode eq '${logicalName}' and statecode eq 0`);
    const r = await fetch(`${ORG_URL}/api/data/v9.2/userqueries?$filter=${userFilter}&$select=name,userqueryid,fetchxml,querytype&$orderby=name asc`, { headers: apiH(), credentials: 'include' });
    if (r.ok) { const d = await r.json(); (d.value||[]).forEach(v => views.push({ id: v.userqueryid, name: v.name, fetchxml: v.fetchxml, type: 'personal' })); }
  } catch(e) { console.warn('[Views] userqueries error:', e); }
  _viewsCache[logicalName] = views;
  return views;
}

function populateViewDropdown(views) {
  const sel = document.getElementById('viewSelect');
  sel.innerHTML = '<option value="">All records</option>';
  sel.disabled = false;
  if (!views || !views.length) return '';
  const sys = views.filter(v => v.type === 'system'), pers = views.filter(v => v.type === 'personal');
  if (sys.length) { const g = document.createElement('optgroup'); g.label = 'System views'; sys.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; g.appendChild(o); }); sel.appendChild(g); }
  if (pers.length) { const g = document.createElement('optgroup'); g.label = 'My views'; pers.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; g.appendChild(o); }); sel.appendChild(g); }
  // Resolve the default: flagged default → an "Active …" view → first system view
  let def = views.find(v => v.isDefault);
  if (!def) def = sys.find(v => /^active\b/i.test(v.name));
  if (!def) def = sys[0];
  return def ? def.id : '';
}

// Parse <attribute> names (main entity only) from a view's FetchXML
function parseViewAttributes(fetchxml, logicalName) {
  const attrs = [];
  try {
    const entityMatch = fetchxml.match(new RegExp(`<entity\\s+name=["']${logicalName}["'][^>]*>([\\s\\S]*?)</entity>`, 'i'));
    if (!entityMatch) return attrs;
    const mainContent = entityMatch[1].replace(/<link-entity[\s\S]*?<\/link-entity>/g, '');
    const attrRegex = /<attribute\s+name=["']([^"']+)["']/g;
    let m; while ((m = attrRegex.exec(mainContent)) !== null) attrs.push(m[1]);
  } catch(e) { console.warn('[parseViewAttributes]', e); }
  return attrs;
}

const FETCHXML_OP_MAP = { 'eq':'equals','ne':'not_equals','neq':'not_equals','like':'contains','not-like':'not_contains','begins-with':'starts_with','ends-with':'ends_with','null':'is_empty','not-null':'is_not_empty','gt':'greater_than','lt':'less_than','ge':'greater_than','le':'less_than','on':'equals','on-or-after':'greater_than','on-or-before':'less_than' };

function parseViewFilters(fetchxml, logicalName) {
  const filters = [];
  try {
    const entityMatch = fetchxml.match(new RegExp(`<entity\\s+name=["']${logicalName}["'][^>]*>([\\s\\S]*?)</entity>`, 'i'));
    if (!entityMatch) return filters;
    let entityContent = entityMatch[1].replace(/<link-entity[\s\S]*?<\/link-entity>/g, '');
    const condRegex = /<condition\s+([^/>]*?)(?:\/>|>([\s\S]*?)<\/condition>)/g;
    let m;
    while ((m = condRegex.exec(entityContent)) !== null) {
      const a = m[1], inner = m[2] || '';
      const attrMatch = a.match(/attribute=["']([^"']+)["']/);
      const opMatch = a.match(/operator=["']([^"']+)["']/);
      const valMatch = a.match(/value=["']([^"']*)["']/);
      if (!attrMatch || !opMatch) continue;
      const ourOp = FETCHXML_OP_MAP[opMatch[1]];
      if (!ourOp) continue;
      let value = valMatch ? valMatch[1] : '';
      if (!value && inner) { const vc = inner.match(/<value[^>]*>([\s\S]*?)<\/value>/); if (vc) value = vc[1].trim(); }
      value = value.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
      filters.push({ column: attrMatch[1], operator: ourOp, value, _fromView: true });
    }
  } catch(e) { console.warn('[parseViewFilters]', e); }
  return filters;
}

// Resolve view filter values (choice ints -> labels, dates -> yyyy-mm-dd) for nicer display + matching
function resolveViewFilterValues(filters, entity) {
  const attrs = ENTITY_ATTRS[entity] || [];
  return filters.map(f => {
    const a = attrs.find(x => x.logicalName === f.column);
    if (!a) return f;
    if (CHOICE_TYPES.has(a.type) && a.options?.length && f.value && !isNaN(Number(f.value))) {
      const opt = a.options.find(o => String(o.value) === String(f.value));
      if (opt) return { ...f, value: opt.label };
    }
    if (a.type === 'DateTimeType' && f.value) {
      const d = new Date(f.value);
      if (!isNaN(d.getTime())) { const pad = n => String(n).padStart(2,'0'); return { ...f, value: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` }; }
    }
    return f;
  });
}

async function changeView() {
  currentView = document.getElementById('viewSelect').value;
  _activeFilters = [];           // reset user filters when switching views
  expandedId = null; currentPage = 1;
  await loadEntityData(currentEntity);
}

// =====================================================
// STATE
// =====================================================
let currentEntity = '';
let allRecords = [];        // array of {_id, _raw, [field]: displayValue}
let displayCols = [];       // primary columns shown in main grid
let allCols = [];           // every attribute (for the detail field-grid)
let childRels = [];
let sortCol = null, sortDir = 'asc';
let currentPage = 1;
const PAGE_SIZE = 25;
let searchTerm = '';
let expandedId = null;             // top-level: only one row expanded at a time
const MAX_DEPTH = 6;               // safety cap on recursion depth

// Generic caches keyed by entity so any record at any depth can reuse them
const _recordCache = {};           // `${entity}|${id}` -> full raw record (all fields)
const _subgridCache = {};          // `${entity}|${id}|${schemaName}` -> {cols, rows, total}
const _detailFieldFilter = {};     // path -> 'all' | 'empty' | 'filled'
const _nodeOpen = {};              // path -> bool (expanded state for nested rows/subgrids)
const _subgridSort = {};           // sgPath -> { col, dir }
const _subgridSearch = {};         // sgPath -> string
const _subgridFilter = {};         // sgPath -> { col, op, value } (single condition over visible cols)
const _subgridFilterOpen = {};     // sgPath -> bool (filter row visible)

// =====================================================
// VALUE FORMATTING
// =====================================================
const FV = '@OData.Community.Display.V1.FormattedValue';

function isEmptyVal(v) { return v === null || v === undefined || v === ''; }

function fieldDisplay(raw, attr) {
  // raw = the record object; returns {text, cls}
  const t = attr.type;
  if (LOOKUP_TYPES.has(t)) {
    const fv = raw[`_${attr.logicalName}_value${FV}`];
    return { text: fv || '', cls: fv ? 'lookup' : 'empty' };
  }
  const fv = raw[`${attr.logicalName}${FV}`];
  if (fv !== undefined && fv !== null && fv !== '') return { text: fv, cls: '' };
  const v = raw[attr.logicalName];
  if (isEmptyVal(v)) return { text: '(empty)', cls: 'empty' };
  if (t === 'BooleanType') return { text: v ? 'Yes' : 'No', cls: '' };
  if (t === 'DateTimeType') { try { return { text: new Date(v).toLocaleString(), cls: '' }; } catch { return { text: String(v), cls: '' }; } }
  return { text: String(v), cls: '' };
}

// =====================================================
// LOAD RECORDS
// =====================================================
function buildPrimaryColumns(logicalName) {
  const entity = ALL_ENTITIES.find(e => e.logicalName === logicalName);
  const attrs = ENTITY_ATTRS[logicalName] || [];

  // If a view is selected for the CURRENT entity, use its attribute list (main-entity attrs only)
  if (logicalName === currentEntity && currentView && _viewsCache[logicalName]) {
    const view = _viewsCache[logicalName].find(v => v.id === currentView);
    if (view?.fetchxml) {
      const names = parseViewAttributes(view.fetchxml, logicalName);
      const SKIP = new Set(['ImageType','UniqueidentifierType','ManagedPropertyType','EntityNameType','FileType']);
      const selected = [], used = new Set();
      names.forEach(name => {
        let a = attrs.find(x => x.logicalName === name);
        if (!a && !attrs.length) a = { logicalName: name, displayName: name, type: 'StringType' };
        if (a && !used.has(a.logicalName) && !SKIP.has(a.type)) { selected.push(a); used.add(a.logicalName); }
      });
      if (selected.length) return selected;
    }
  }

  const priority = [entity?.primaryNameAttr,'name','fullname','subject','title','emailaddress1','telephone1','statecode','statuscode','createdon','modifiedon'];
  const selected = [], used = new Set();
  priority.forEach(p => { if (!p) return; const a = attrs.find(x => x.logicalName === p); if (a && !used.has(p)) { selected.push(a); used.add(p); } });
  for (const a of attrs) {
    if (selected.length >= 8) break;
    if (used.has(a.logicalName)) continue;
    if (a.type === 'FileType' || a.type === 'ImageType' || a.type === 'UniqueidentifierType') continue;
    selected.push(a); used.add(a.logicalName);
  }
  return selected;
}

async function fetchRecords(logicalName) {
  showLoading('Loading records…');
  try {
    const entity = ALL_ENTITIES.find(e => e.logicalName === logicalName);
    await loadEntityAttributes(logicalName);
    childRels = await loadChildRelationships(logicalName);
    allCols = (ENTITY_ATTRS[logicalName] || []).filter(a => a.type !== 'FileType' && a.type !== 'ImageType');
    displayCols = buildPrimaryColumns(logicalName);

    // If a view is selected, let Dataverse apply its filter + sort via the saved query param.
    let url = `${ORG_URL}/api/data/v9.2/${entity.entitySetName}?$top=250`;
    if (currentView && _viewsCache[logicalName]) {
      const view = _viewsCache[logicalName].find(v => v.id === currentView);
      if (view) {
        const param = view.type === 'personal' ? 'userQuery' : 'savedQuery';
        url = `${ORG_URL}/api/data/v9.2/${entity.entitySetName}?${param}=${currentView}&$top=250`;
        // Seed the filter UI with this view's conditions so the user can see/tweak them
        const raw = parseViewFilters(view.fetchxml, logicalName);
        _activeFilters = resolveViewFilterValues(raw, logicalName);
      }
    }

    const records = [];
    const r = await fetch(url, { headers: apiHRead(), credentials: "include" });
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error?.message || `${r.status}`);
    const data = await r.json();
    (data.value || []).forEach(rec => {
      const idAttr = entity.primaryIdAttr;
      const id = rec[idAttr];
      _recordCache[`${logicalName}|${id}`] = rec;
      const row = { _id: id, _raw: rec };
      displayCols.forEach(c => { row[c.logicalName] = fieldDisplay(rec, c); });
      records.push(row);
    });
    allRecords = records;
    currentPage = 1; expandedId = null;
    updateFilterButton();
    const viewNote = currentView ? ` · view filtered` : '';
    showStatus('success', `Loaded ${allRecords.length} ${entity.displayName} record${allRecords.length===1?'':'s'} · ${childRels.length} child relationship${childRels.length===1?'':'s'}${viewNote}`);
    renderTable(); hideLoading();
  } catch(e) {
    allRecords = []; renderTable(); hideLoading();
    showStatus('error', `Failed to load: ${e.message}`);
  }
}

// Fetch child records for a subgrid (lazy, cached, depth-agnostic).
// Caches each child's FULL raw record so it can itself be expanded later.
async function fetchSubgrid(parentEntity, recordId, rel) {
  const ck = `${parentEntity}|${recordId}|${rel.schemaName}`;
  if (_subgridCache[ck]) return _subgridCache[ck];
  if (!_isLive) return fetchSubgridMock(recordId, rel, ck);
  try {
    await loadEntityAttributes(rel.childEntity);
    const childCols = buildPrimaryColumns(rel.childEntity).slice(0, 5);
    const childEntity = ALL_ENTITIES.find(e => e.logicalName === rel.childEntity);
    const url = `${ORG_URL}/api/data/v9.2/${rel.childEntitySet}?$filter=_${rel.fkField}_value eq ${recordId}&$top=50&$count=true`;
    const r = await fetch(url, { headers: apiHRead(), credentials: "include" });
    if (!r.ok) throw new Error(`${r.status}`);
    const data = await r.json();
    const rows = (data.value||[]).map(rec => {
      const id = rec[childEntity.primaryIdAttr];
      _recordCache[`${rel.childEntity}|${id}`] = rec;      // stash full record for drill-down
      const row = { _id: id, _entity: rel.childEntity, _raw: rec, _cells: {} };
      childCols.forEach(c => { row._cells[c.logicalName] = fieldDisplay(rec, c); });
      return row;
    });
    const result = { cols: childCols, rows, total: data['@odata.count'] ?? rows.length, childEntity: rel.childEntity };
    _subgridCache[ck] = result;
    return result;
  } catch(e) { const result = { cols: [], rows: [], total: 0, error: e.message, childEntity: rel.childEntity }; _subgridCache[ck] = result; return result; }
}

// =====================================================
// FILTER / SORT / PAGE
// =====================================================
function getFilteredSorted() {
  let rows = allRecords;
  // Active filter conditions (skip ones already enforced server-side by the view to avoid value-mismatch drops)
  const clientFilters = _activeFilters.filter(f => !(f._fromView && _isLive && currentView));
  if (clientFilters.length) {
    rows = rows.filter(r => clientFilters.every(f => matchesFilter(r, f)));
  }
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    rows = rows.filter(r => displayCols.some(c => (r[c.logicalName]?.text||'').toLowerCase().includes(q)));
  }
  if (sortCol) {
    rows = [...rows].sort((a,b) => {
      const av = (a[sortCol]?.text||'').toLowerCase(), bv = (b[sortCol]?.text||'').toLowerCase();
      if (av < bv) return sortDir==='asc'?-1:1;
      if (av > bv) return sortDir==='asc'?1:-1;
      return 0;
    });
  }
  return rows;
}

// Resolve a record's value for a given attribute key (uses formatted display text)
function filterValueFor(row, key) {
  const attr = (ENTITY_ATTRS[currentEntity]||[]).find(a => a.logicalName === key);
  if (!attr) return { text: String(row._raw?.[key] ?? ''), attr: null };
  const d = fieldDisplay(row._raw, attr);
  return { text: d.cls === 'empty' ? '' : d.text, attr };
}

function matchesFilter(row, f) {
  const { text, attr } = filterValueFor(row, f.column);
  // Datetime comparison
  if (attr && attr.type === 'DateTimeType') {
    const recDate = row._raw[f.column] ? new Date(row._raw[f.column]) : null;
    const testDate = f.value ? new Date(f.value) : null;
    const toDay = d => d && !isNaN(d) ? new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime() : null;
    const rd = toDay(recDate), td = toDay(testDate);
    switch (f.operator) {
      case 'is_empty': return !recDate;
      case 'is_not_empty': return !!recDate;
      case 'equals': return rd!=null && td!=null && rd===td;
      case 'not_equals': return !(rd!=null && td!=null && rd===td);
      case 'greater_than': return rd!=null && td!=null && rd>td;
      case 'less_than': return rd!=null && td!=null && rd<td;
      default: break;
    }
  }
  const val = String(text||'').toLowerCase();
  const test = String(f.value||'').toLowerCase();
  switch (f.operator) {
    case 'contains': return val.includes(test);
    case 'not_contains': return !val.includes(test);
    case 'equals': return val === test;
    case 'not_equals': return val !== test;
    case 'starts_with': return val.startsWith(test);
    case 'ends_with': return val.endsWith(test);
    case 'is_empty': return !val;
    case 'is_not_empty': return !!val;
    case 'greater_than': { const a=parseFloat(val),b=parseFloat(test); return !isNaN(a)&&!isNaN(b)&&a>b; }
    case 'less_than': { const a=parseFloat(val),b=parseFloat(test); return !isNaN(a)&&!isNaN(b)&&a<b; }
    default: return true;
  }
}

// ── Filter modal ──
let _activeFilters = [];  // [{column, operator, value, _fromView?}]
let _draftFilters = [];

const FILTER_OPERATORS = [
  { value:'contains', label:'contains', needsValue:true },
  { value:'not_contains', label:'does not contain', needsValue:true },
  { value:'equals', label:'equals', needsValue:true },
  { value:'not_equals', label:'does not equal', needsValue:true },
  { value:'starts_with', label:'starts with', needsValue:true },
  { value:'ends_with', label:'ends with', needsValue:true },
  { value:'is_empty', label:'is empty', needsValue:false },
  { value:'is_not_empty', label:'is not empty', needsValue:false },
  { value:'greater_than', label:'greater than', needsValue:true },
  { value:'less_than', label:'less than', needsValue:true },
];

function getFilterableColumns() {
  const attrs = ENTITY_ATTRS[currentEntity] || [];
  return attrs
    .filter(a => a.type !== 'FileType' && a.type !== 'ImageType' && a.type !== 'UniqueidentifierType')
    .map(a => ({
      key: a.logicalName, label: a.displayName, type: a.type,
      isChoice: CHOICE_TYPES.has(a.type), isDate: a.type === 'DateTimeType',
      options: (a.options||[]).map(o => ({ value:o.value, label:o.label })),
    }))
    .sort((a,b) => a.label.localeCompare(b.label));
}

function openFilterModal() {
  if (!currentEntity) { showStatus('warn','Select a table first'); return; }
  _draftFilters = _activeFilters.map(f => ({...f}));
  if (!_draftFilters.length) _draftFilters.push({ column:'', operator:'contains', value:'' });
  renderFilterModal();
  document.getElementById('filterModalOverlay').classList.add('visible');
}
function closeFilterModal(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('filterModalOverlay').classList.remove('visible'); }
function addFilterCondition() { _draftFilters.push({ column:'', operator:'contains', value:'' }); renderFilterModal(); }
function removeFilterCondition(idx) { _draftFilters.splice(idx,1); if (!_draftFilters.length) _draftFilters.push({ column:'', operator:'contains', value:'' }); renderFilterModal(); }
function clearFilters() { _draftFilters = [{ column:'', operator:'contains', value:'' }]; _activeFilters = []; renderFilterModal(); currentPage=1; updateFilterButton(); renderTable(); }
function applyFilterModal() {
  _activeFilters = _draftFilters.filter(f => { if (!f.column) return false; const op = FILTER_OPERATORS.find(o=>o.value===f.operator); if (op?.needsValue && !f.value) return false; return true; });
  currentPage = 1; updateFilterButton(); renderTable(); closeFilterModal();
}
function updateFilterField(idx, field, value) {
  _draftFilters[idx][field] = value;
  delete _draftFilters[idx]._fromView; // editing a view filter makes it a user filter
  if (field === 'operator') { const op = FILTER_OPERATORS.find(o=>o.value===value); if (op && !op.needsValue) _draftFilters[idx].value=''; renderFilterModal(); }
}
function renderFilterModal() {
  const cols = getFilterableColumns();
  const body = document.getElementById('filterModalBody');
  if (!cols.length) { body.innerHTML = '<div class="filter-empty">Select a table first</div>'; return; }
  body.innerHTML = _draftFilters.map((f, idx) => {
    const op = FILTER_OPERATORS.find(o=>o.value===f.operator) || FILTER_OPERATORS[0];
    const col = cols.find(c => c.key === f.column);
    let valueInput;
    if (!op.needsValue) {
      valueInput = `<input type="text" disabled placeholder="No value needed" style="background:#f5f5f5;flex:1">`;
    } else if (col?.isChoice && col.options.length) {
      valueInput = `<select onchange="updateFilterField(${idx},'value',this.value)" style="flex:1"><option value="">Choose a value…</option>${col.options.map(o=>`<option value="${esc(o.label)}" ${f.value===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else if (col?.isDate) {
      valueInput = `<input type="date" value="${esc(f.value||'')}" oninput="updateFilterField(${idx},'value',this.value)" style="flex:1">`;
    } else {
      valueInput = `<input type="text" value="${esc(f.value||'')}" oninput="updateFilterField(${idx},'value',this.value)" placeholder="Enter value…" style="flex:1">`;
    }
    const badge = f._fromView ? `<span class="view-badge" title="From the selected view">VIEW</span>` : '';
    return `<div class="filter-row">
      ${badge}
      <select onchange="updateFilterField(${idx},'column',this.value)" style="flex:1.2;min-width:150px"><option value="">— Column —</option>${cols.map(c=>`<option value="${esc(c.key)}" ${f.column===c.key?'selected':''}>${esc(c.label)}</option>`).join('')}</select>
      <select onchange="updateFilterField(${idx},'operator',this.value)" style="flex:1;min-width:130px">${FILTER_OPERATORS.map(o=>`<option value="${o.value}" ${f.operator===o.value?'selected':''}>${o.label}</option>`).join('')}</select>
      ${valueInput}
      <button class="fr-remove" onclick="removeFilterCondition(${idx})" title="Remove"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>`;
  }).join('');
}
function updateFilterButton() {
  const btn = document.getElementById('filterBtn');
  if (!btn) return;
  const n = _activeFilters.length;
  btn.classList.toggle('filterBtn-active', n > 0);
  btn.title = n ? `Filter (${n} active)` : 'Filter';
}

function changePage(d) {
  const total = getFilteredSorted().length;
  const maxPage = Math.max(1, Math.ceil(total / PAGE_SIZE));
  currentPage = Math.min(maxPage, Math.max(1, currentPage + d));
  renderTable();
}

function sortByColumn(key) {
  if (sortCol === key) { sortDir = sortDir==='asc'?'desc':'asc'; }
  else { sortCol = key; sortDir = 'asc'; }
  renderTable();
}

function onSearch() { searchTerm = document.getElementById('searchInput').value.trim(); currentPage = 1; renderTable(); }

// =====================================================
// RENDER
// =====================================================
function renderTable() {
  const head = document.getElementById('listHead');
  const body = document.getElementById('listBody');
  const empty = document.getElementById('emptyState');
  const table = document.getElementById('listTable');

  if (!currentEntity) {
    table.style.display = 'none'; empty.style.display = 'flex';
    document.getElementById('esTitle').textContent = 'Pick a table to begin';
    updateFooter(0); updateCount();
    return;
  }
  if (!allRecords.length) {
    table.style.display = 'none'; empty.style.display = 'flex';
    document.getElementById('esTitle').textContent = 'No records found';
    document.getElementById('esSub').textContent = 'This table returned no records, or none matched your search.';
    updateFooter(0); updateCount();
    return;
  }
  table.style.display = 'table'; empty.style.display = 'none';

  // Header
  let h = '<tr class="list-header"><th class="th col-expand"></th>';
  displayCols.forEach(c => {
    const sortCls = sortCol === c.logicalName ? (sortDir==='asc'?'sort-asc':'sort-desc') : '';
    h += `<th class="th ${sortCls}" onclick="sortByColumn('${c.logicalName}')"><div class="th-inner">${esc(c.displayName)}
      <span class="sort-icon"><svg class="arrow-up" width="8" height="5" viewBox="0 0 8 5"><path d="M4 0l4 5H0z"/></svg><svg class="arrow-down" width="8" height="5" viewBox="0 0 8 5"><path d="M4 5L0 0h8z"/></svg></span>
      </div><span class="th-sub">${esc(c.logicalName)}</span></th>`;
  });
  h += '</tr>';
  head.innerHTML = h;

  // Body (paged)
  const rows = getFilteredSorted();
  const start = (currentPage-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);
  const colspan = displayCols.length + 1;

  let b = '';
  pageRows.forEach(row => {
    const isOpen = expandedId === row._id;
    b += `<tr class="list-row ${isOpen?'expanded':''}" onclick="toggleExpand('${row._id}')">`;
    b += `<td class="td-expand"><button class="expand-btn ${isOpen?'open':''}" onclick="event.stopPropagation();toggleExpand('${row._id}')" title="Inspect record">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button></td>`;
    displayCols.forEach(c => {
      const cell = row[c.logicalName] || { text:'', cls:'empty' };
      const clsMap = cell.cls === 'lookup' ? 'cell-lookup' : cell.cls === 'empty' ? 'cell-empty' : '';
      const txt = cell.cls === 'empty' ? '—' : esc(cell.text);
      b += `<td class="${clsMap}" title="${esc(cell.text)}">${txt}</td>`;
    });
    b += '</tr>';
    if (isOpen) {
      const path = row._id; // root path
      b += `<tr class="detail-row"><td colspan="${colspan}"><div class="detail-wrap" id="detail-${cssId(path)}">${renderNode(currentEntity, row._raw, path, 0, null)}</div></td></tr>`;
    }
  });
  body.innerHTML = b;

  updateFooter(rows.length); updateCount();

  // Kick off subgrid count loads for the expanded row
  if (expandedId) loadNodeCounts(currentEntity, expandedId, expandedId, 0);
}

// =====================================================
// RECURSIVE NODE SYSTEM
// A "node" is one record's detail view (fields + child subgrids).
// Nodes nest arbitrarily deep. Each node/subgrid/row is identified by a
// unique `path` string so DOM ids never collide across depths.
// =====================================================
const _pathRegistry = {};   // path -> { kind:'node'|'subgrid'|'row', entity, id, schema, parentEntity, depth, rel }

function cssId(path) { return 'p_' + btoa(unescape(encodeURIComponent(path))).replace(/[^a-zA-Z0-9]/g,''); }

// Render a record's detail: field grid + collapsible child-relationship subgrids.
// entity: logical name, raw: the record object, path: unique key, depth: recursion depth,
// crumb: optional array of {entity, label} breadcrumb for nested nodes.
function renderNode(entity, raw, path, depth, crumb) {
  _pathRegistry[path] = { kind:'node', entity, id: raw[entIdAttr(entity)], depth };
  const cols = (ENTITY_ATTRS[entity] || []).filter(a => a.type !== 'FileType' && a.type !== 'ImageType');
  const rels = _childRelCache[entity] || [];
  const filter = _detailFieldFilter[path] || 'filled';

  let fields = cols.map(a => { const d = fieldDisplay(raw, a); return { attr:a, disp:d, empty:d.cls==='empty' }; });
  const emptyCount = fields.filter(f => f.empty).length;
  const filledCount = fields.length - emptyCount;
  if (filter === 'empty') fields = fields.filter(f => f.empty);
  else if (filter === 'filled') fields = fields.filter(f => !f.empty);

  let html = '';

  // Breadcrumb (only for nested nodes)
  if (crumb && crumb.length) {
    html += '<div class="node-crumb">';
    crumb.forEach((c,i) => {
      html += `<span class="crumb-entity">${esc(c.label)}</span>`;
      if (i < crumb.length-1) html += '<span class="crumb-sep">›</span>';
    });
    html += '</div>';
  }

  // Fields
  html += `<div class="detail-section-title">Fields
    <span class="pill">${cols.length} total · ${filledCount} filled · ${emptyCount} empty</span>
    <span class="field-filter">
      <button class="ff-btn ${filter==='all'?'active':''}" onclick="setFieldFilter('${esc(path)}','all')">All</button>
      <button class="ff-btn ${filter==='filled'?'active':''}" onclick="setFieldFilter('${esc(path)}','filled')">Filled</button>
      <button class="ff-btn ${filter==='empty'?'active':''}" onclick="setFieldFilter('${esc(path)}','empty')">Empty</button>
    </span></div>`;
  html += '<div class="field-grid">';
  fields.forEach(f => {
    const typeShort = f.attr.type.replace('Type','');
    const isLookup = LOOKUP_TYPES.has(f.attr.type) && !f.empty;
    const rawId = isLookup ? raw[`_${f.attr.logicalName}_value`] : null;
    const targetEntity = f.attr.lookupTarget?.targetEntity;
    const valCls = f.disp.cls === 'lookup' ? 'lookup' : f.empty ? 'empty' : '';
    const valTxt = f.empty ? '(empty)' : esc(f.disp.text);
    let valueHtml;
    if (isLookup && rawId && targetEntity) {
      const lkIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M7 7h10v10"/></svg>`;
      valueHtml = `<span class="field-value lookup clickable" title="Open ${esc(targetEntity)} record" onclick="openLookupPanel('${esc(targetEntity)}','${esc(rawId)}','${esc(f.disp.text)}')">${valTxt}${lkIcon}</span>`;
    } else {
      valueHtml = `<div class="field-value ${valCls}">${valTxt}</div>`;
    }
    html += `<div class="field-cell ${f.empty?'is-empty':''}">
      <div class="field-label" title="${esc(f.attr.logicalName)}">${esc(f.attr.displayName)} <span class="ftype">${esc(typeShort)}</span></div>
      ${valueHtml}
    </div>`;
  });
  html += '</div>';

  // Child subgrids
  if (depth >= MAX_DEPTH) {
    html += `<div class="detail-section-title">Connected child records</div>
      <div class="depth-note">Maximum drill-down depth reached (${MAX_DEPTH} levels).</div>`;
    return html;
  }
  if (rels.length) {
    html += `<div class="detail-section-title">Connected child records <span class="pill">${rels.length} relationship${rels.length===1?'':'s'}</span></div>`;
    rels.forEach(rel => {
      const sgPath = `${path}/${rel.schemaName}`;
      const sgKey = cssId(sgPath);
      _pathRegistry[sgPath] = { kind:'subgrid', entity, id: raw[entIdAttr(entity)], schema: rel.schemaName, depth, rel };
      const isOpen = !!_nodeOpen[sgPath];
      html += `<div class="subgrid-block">
        <div class="subgrid-head ${isOpen?'open':''}" id="head-${sgKey}" onclick="toggleSubgrid('${esc(sgPath)}')">
          <svg class="sg-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          <span class="sg-name">${esc(rel.childDisplay)}</span>
          <span class="sg-rel">via ${esc(rel.fkField)}${rel.isCustom?' · custom':''}</span>
          <span class="subgrid-count" id="count-${sgKey}">…</span>
        </div>
        <div class="subgrid-body" id="body-${sgKey}" style="display:${isOpen?'block':'none'}"></div>
      </div>`;
    });
  } else {
    html += `<div class="detail-section-title">Connected child records <span class="pill">none</span></div>
      <div class="sg-empty">No 1:N relationships discovered for this table.</div>`;
  }
  return html;
}

function entIdAttr(entity) { return ALL_ENTITIES.find(e => e.logicalName === entity)?.primaryIdAttr; }

// Render the table of child rows for a subgrid, with each row expandable.
function renderSubgridTable(result, sgPath, depth) {
  if (result.error) return `<div class="sg-empty">Could not load: ${esc(result.error)}</div>`;
  const childEntity = result.childEntity;
  const totalRows = result.rows.length;

  // ── Toolbar: search + filter ──
  const sgKey = cssId(sgPath);
  const search = _subgridSearch[sgPath] || '';
  const filt = _subgridFilter[sgPath];
  const filterOpen = !!_subgridFilterOpen[sgPath];
  const hasFilter = filt && filt.col && (SG_NOVAL_OPS.has(filt.op) || filt.value);
  let toolbar = `<div class="sg-toolbar">
    <div class="sg-search">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Search ${esc(result.cols.map(c=>c.displayName).slice(0,2).join(', '))}…" value="${esc(search)}" oninput="onSubgridSearch('${esc(sgPath)}',this.value)">
    </div>
    <button class="sg-filter-btn ${hasFilter?'active':''}" onclick="toggleSubgridFilter('${esc(sgPath)}')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filter${hasFilter?' (1)':''}
    </button>
  </div>`;
  if (filterOpen) {
    const f = filt || { col: result.cols[0]?.logicalName || '', op: 'contains', value: '' };
    const colOpts = result.cols.map(c => `<option value="${esc(c.logicalName)}" ${f.col===c.logicalName?'selected':''}>${esc(c.displayName)}</option>`).join('');
    const opOpts = SG_OPERATORS.map(o => `<option value="${o.value}" ${f.op===o.value?'selected':''}>${o.label}</option>`).join('');
    const needsVal = !SG_NOVAL_OPS.has(f.op);
    toolbar += `<div class="sg-filter-row">
      <select onchange="setSubgridFilter('${esc(sgPath)}','col',this.value)">${colOpts}</select>
      <select onchange="setSubgridFilter('${esc(sgPath)}','op',this.value)">${opOpts}</select>
      <input type="text" placeholder="Value…" value="${esc(f.value||'')}" ${needsVal?'':'disabled style=background:#f5f5f5'} oninput="setSubgridFilter('${esc(sgPath)}','value',this.value)">
      <button class="ff-clear" onclick="clearSubgridFilter('${esc(sgPath)}')">Clear</button>
    </div>`;
  }

  // ── Apply search + filter ──
  let rows = result.rows;
  if (search) {
    const q = search.toLowerCase();
    rows = rows.filter(r => result.cols.some(c => (r._cells[c.logicalName]?.text||'').toLowerCase().includes(q)));
  }
  if (hasFilter) {
    rows = rows.filter(r => matchesSubgridFilter(r, filt));
  }
  const shownAfterFilter = rows.length;

  // ── Sort ──
  const sort = _subgridSort[sgPath];
  if (sort && sort.col) {
    rows = [...rows].sort((a,b) => {
      const av = (a._cells[sort.col]?.text||'').toLowerCase();
      const bv = (b._cells[sort.col]?.text||'').toLowerCase();
      if (av < bv) return sort.dir==='asc'?-1:1;
      if (av > bv) return sort.dir==='asc'?1:-1;
      return 0;
    });
  }

  if (!totalRows) return toolbar + '<div class="sg-empty">No related records.</div>';

  const sortIcon = `<span class="sg-sort-icon"><svg class="a-up" width="7" height="4" viewBox="0 0 8 5"><path d="M4 0l4 5H0z"/></svg><svg class="a-down" width="7" height="4" viewBox="0 0 8 5"><path d="M4 5L0 0h8z"/></svg></span>`;
  let t = '<table class="sg-table"><thead><tr><th class="sg-expand-cell"></th>';
  result.cols.forEach(c => {
    const sc = sort && sort.col === c.logicalName ? (sort.dir==='asc'?'sort-asc':'sort-desc') : '';
    t += `<th class="sortable ${sc}" onclick="sortSubgrid('${esc(sgPath)}','${esc(c.logicalName)}')"><span class="sg-th-inner">${esc(c.displayName)}${sortIcon}</span></th>`;
  });
  t += '</tr></thead><tbody>';
  rows.forEach(r => {
    const rowPath = `${sgPath}/${r._id}`;
    const rowKey = cssId(rowPath);
    _pathRegistry[rowPath] = { kind:'row', entity: childEntity, id: r._id, depth: depth+1, parentEntity: childEntity };
    const isOpen = !!_nodeOpen[rowPath];
    const canDrill = depth+1 < MAX_DEPTH;
    t += `<tr class="sg-row ${isOpen?'open':''}" id="row-${rowKey}">
      <td class="sg-expand-cell">
        <button class="sg-row-toggle ${isOpen?'open':''}" ${canDrill?'':'disabled'} onclick="toggleRow('${esc(rowPath)}')" title="${canDrill?'Drill into this record':'Max depth reached'}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </td>`;
    result.cols.forEach(c => {
      const cell = r._cells[c.logicalName] || {text:'',cls:'empty'};
      const attr = (ENTITY_ATTRS[childEntity]||[]).find(a => a.logicalName === c.logicalName);
      const isLookup = attr && LOOKUP_TYPES.has(attr.type) && cell.cls === 'lookup';
      const rawId = isLookup && r._raw ? r._raw[`_${c.logicalName}_value`] : null;
      const targetEntity = attr?.lookupTarget?.targetEntity;
      const txt = cell.cls === 'empty' ? '—' : esc(cell.text);
      if (isLookup && rawId && targetEntity) {
        t += `<td class="cell-lookup clickable" title="Open ${esc(targetEntity)} record" onclick="event.stopPropagation();openLookupPanel('${esc(targetEntity)}','${esc(rawId)}','${esc(cell.text)}')">${txt}</td>`;
      } else {
        const cls = cell.cls === 'lookup' ? 'cell-lookup' : cell.cls === 'empty' ? 'cell-empty' : '';
        t += `<td class="${cls}" title="${esc(cell.text)}">${txt}</td>`;
      }
    });
    t += '</tr>';
    t += `<tr class="nested-detail-tr" id="nested-${rowKey}" style="display:${isOpen?'table-row':'none'}">
      <td class="sg-nested-cell" colspan="${result.cols.length+1}"><div class="sg-nested-wrap" id="nestedwrap-${rowKey}"></div></td>
    </tr>`;
  });
  t += '</tbody></table>';

  let note = '';
  if (search || hasFilter) note = `<div class="sg-result-note">Showing ${shownAfterFilter} of ${totalRows} loaded${result.total>totalRows?` (${result.total} total)`:''}</div>`;
  else if (result.total > totalRows) note = `<div class="sg-more">Showing first ${totalRows} of ${result.total}</div>`;
  return toolbar + t + note;
}

// Subgrid filter operators (operate on formatted cell text)
const SG_OPERATORS = [
  { value:'contains', label:'contains' },
  { value:'not_contains', label:'does not contain' },
  { value:'equals', label:'equals' },
  { value:'starts_with', label:'starts with' },
  { value:'is_empty', label:'is empty' },
  { value:'is_not_empty', label:'is not empty' },
];
const SG_NOVAL_OPS = new Set(['is_empty','is_not_empty']);

function matchesSubgridFilter(row, f) {
  const cell = row._cells[f.col] || { text:'', cls:'empty' };
  const val = (cell.cls === 'empty' ? '' : String(cell.text||'')).toLowerCase();
  const test = String(f.value||'').toLowerCase();
  switch (f.op) {
    case 'contains': return val.includes(test);
    case 'not_contains': return !val.includes(test);
    case 'equals': return val === test;
    case 'starts_with': return val.startsWith(test);
    case 'is_empty': return !val;
    case 'is_not_empty': return !!val;
    default: return true;
  }
}

// Re-render just the subgrid body in place (no refetch) — keeps nested rows' open state
async function rerenderSubgridBody(sgPath) {
  const ctx = _pathRegistry[sgPath];
  if (!ctx) return;
  const sgKey = cssId(sgPath);
  const bodyEl = document.getElementById(`body-${sgKey}`);
  if (!bodyEl) return;
  const result = await fetchSubgrid(ctx.entity, ctx.id, ctx.rel); // cached, no network
  bodyEl.innerHTML = renderSubgridTable(result, sgPath, ctx.depth);
  for (const r of result.rows) { const rp = `${sgPath}/${r._id}`; if (_nodeOpen[rp]) await openRow(rp); }
  // keep focus in the search box after re-render
  const inp = bodyEl.querySelector('.sg-search input');
  if (inp && document.activeElement !== inp && _subgridSearch[sgPath]) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function onSubgridSearch(sgPath, val) {
  _subgridSearch[sgPath] = val;
  // debounce-light: re-render on each keystroke (datasets are small, ≤50 rows)
  rerenderSubgridBody(sgPath);
}
function toggleSubgridFilter(sgPath) {
  _subgridFilterOpen[sgPath] = !_subgridFilterOpen[sgPath];
  if (_subgridFilterOpen[sgPath] && !_subgridFilter[sgPath]) {
    const ctx = _pathRegistry[sgPath];
    const result = _subgridCache[`${ctx.entity}|${ctx.id}|${ctx.schema}`];
    const firstCol = result?.cols?.[0]?.logicalName || '';
    _subgridFilter[sgPath] = { col: firstCol, op: 'contains', value: '' };
  }
  rerenderSubgridBody(sgPath);
}
function setSubgridFilter(sgPath, field, value) {
  if (!_subgridFilter[sgPath]) _subgridFilter[sgPath] = { col:'', op:'contains', value:'' };
  _subgridFilter[sgPath][field] = value;
  if (field === 'op' && SG_NOVAL_OPS.has(value)) _subgridFilter[sgPath].value = '';
  rerenderSubgridBody(sgPath);
}
function clearSubgridFilter(sgPath) {
  delete _subgridFilter[sgPath];
  _subgridFilterOpen[sgPath] = false;
  rerenderSubgridBody(sgPath);
}

// Sort a subgrid by a column and re-render its body (preserving open nested rows)
async function sortSubgrid(sgPath, col) {
  const cur = _subgridSort[sgPath];
  if (cur && cur.col === col) _subgridSort[sgPath] = { col, dir: cur.dir==='asc'?'desc':'asc' };
  else _subgridSort[sgPath] = { col, dir: 'asc' };
  await rerenderSubgridBody(sgPath);
}

// Fetch subgrid counts (badge only) for all relationships of a node, without expanding bodies.
async function loadNodeCounts(entity, recordId, path, depth) {
  if (depth >= MAX_DEPTH) return;
  const rels = _childRelCache[entity] || [];
  for (const rel of rels) {
    const sgPath = `${path}/${rel.schemaName}`;
    const sgKey = cssId(sgPath);
    const countEl = document.getElementById(`count-${sgKey}`);
    if (!countEl) continue;
    const result = await fetchSubgrid(entity, recordId, rel);
    const total = result.total ?? (result.rows?.length||0);
    countEl.textContent = total;
    countEl.classList.toggle('zero', total === 0);
    // If this subgrid was already open, re-render its body (restores state on re-render)
    if (_nodeOpen[sgPath]) await openSubgrid(sgPath);
  }
}

async function openSubgrid(sgPath) {
  const ctx = _pathRegistry[sgPath];
  if (!ctx) return;
  const sgKey = cssId(sgPath);
  const bodyEl = document.getElementById(`body-${sgKey}`);
  const head = document.getElementById(`head-${sgKey}`);
  if (!bodyEl) return;
  bodyEl.style.display = 'block';
  if (head) head.classList.add('open');
  bodyEl.innerHTML = '<div class="sg-loading">Loading related records…</div>';
  const result = await fetchSubgrid(ctx.entity, ctx.id, ctx.rel);
  const countEl = document.getElementById(`count-${sgKey}`);
  if (countEl) { countEl.textContent = result.total ?? result.rows.length; countEl.classList.toggle('zero', (result.total||0)===0); }
  bodyEl.innerHTML = renderSubgridTable(result, sgPath, ctx.depth);
  // Restore any open nested rows beneath this subgrid
  for (const r of result.rows) {
    const rowPath = `${sgPath}/${r._id}`;
    if (_nodeOpen[rowPath]) await openRow(rowPath);
  }
}

async function toggleSubgrid(sgPath) {
  const open = !!_nodeOpen[sgPath];
  if (open) {
    _nodeOpen[sgPath] = false;
    const sgKey = cssId(sgPath);
    const bodyEl = document.getElementById(`body-${sgKey}`);
    const head = document.getElementById(`head-${sgKey}`);
    if (bodyEl) bodyEl.style.display = 'none';
    if (head) head.classList.remove('open');
    return;
  }
  _nodeOpen[sgPath] = true;
  await openSubgrid(sgPath);
}

async function openRow(rowPath) {
  const ctx = _pathRegistry[rowPath];
  if (!ctx) return;
  const rowKey = cssId(rowPath);
  const nestedTr = document.getElementById(`nested-${rowKey}`);
  const wrap = document.getElementById(`nestedwrap-${rowKey}`);
  const toggle = document.querySelector(`#row-${rowKey} .sg-row-toggle`);
  const rowEl = document.getElementById(`row-${rowKey}`);
  if (!wrap || !nestedTr) return;
  nestedTr.style.display = 'table-row';
  if (toggle) toggle.classList.add('open');
  if (rowEl) rowEl.classList.add('open');

  // Ensure we have the full record + its child relationships loaded
  let raw = _recordCache[`${ctx.entity}|${ctx.id}`];
  wrap.innerHTML = '<div class="sg-loading">Loading record…</div>';
  if (!raw && _isLive) {
    try {
      const ent = ALL_ENTITIES.find(e => e.logicalName === ctx.entity);
      raw = await dvFetch(`${ORG_URL}/api/data/v9.2/${ent.entitySetName}(${ctx.id})`);
      _recordCache[`${ctx.entity}|${ctx.id}`] = raw;
    } catch(e) { wrap.innerHTML = `<div class="sg-empty">Could not load record: ${esc(e.message)}</div>`; return; }
  }
  if (!raw) { wrap.innerHTML = '<div class="sg-empty">Record unavailable.</div>'; return; }
  await loadEntityAttributes(ctx.entity);
  await loadChildRelationships(ctx.entity);

  const childEnt = ALL_ENTITIES.find(e => e.logicalName === ctx.entity);
  const crumb = [{ label: `${childEnt.displayName}: ${recordTitle(ctx.entity, raw)}` }];
  wrap.innerHTML = renderNode(ctx.entity, raw, rowPath, ctx.depth, crumb);
  // Load child counts for this newly opened nested node
  loadNodeCounts(ctx.entity, ctx.id, rowPath, ctx.depth);
}

async function toggleRow(rowPath) {
  const open = !!_nodeOpen[rowPath];
  if (open) {
    _nodeOpen[rowPath] = false;
    const rowKey = cssId(rowPath);
    const nestedTr = document.getElementById(`nested-${rowKey}`);
    const toggle = document.querySelector(`#row-${rowKey} .sg-row-toggle`);
    const rowEl = document.getElementById(`row-${rowKey}`);
    if (nestedTr) nestedTr.style.display = 'none';
    if (toggle) toggle.classList.remove('open');
    if (rowEl) rowEl.classList.remove('open');
    return;
  }
  _nodeOpen[rowPath] = true;
  await openRow(rowPath);
}

function recordTitle(entity, raw) {
  const ent = ALL_ENTITIES.find(e => e.logicalName === entity);
  const nameAttr = ent?.primaryNameAttr;
  if (nameAttr && raw[nameAttr]) return raw[nameAttr];
  return ent?.displayName || entity;
}

// =====================================================
// LOOKUP SIDE PANEL — inspect a looked-up record's attributes
// =====================================================
let _lkStack = [];            // breadcrumb stack of {entity, id, label}
let _lkFieldFilter = 'filled';

async function openLookupPanel(entity, id, label, isBack) {
  const ent = ALL_ENTITIES.find(e => e.logicalName === entity);
  if (!ent) { showStatus('warn', `Unknown table: ${entity}`); return; }
  if (!isBack) _lkStack.push({ entity, id, label });
  document.getElementById('lookupPanelOverlay').classList.add('open');
  document.getElementById('lkTitle').textContent = label || ent.displayName;
  document.getElementById('lkSub').textContent = `${ent.displayName} · ${entity}`;
  const body = document.getElementById('lkBody');
  body.innerHTML = `<div class="lk-loading"><div class="spinner"></div><div>Loading record…</div></div>`;

  try {
    await loadEntityAttributes(entity);
    let raw = _recordCache[`${entity}|${id}`];
    if (!raw) {
      if (_isLive) {
        raw = await dvFetch(`${ORG_URL}/api/data/v9.2/${ent.entitySetName}(${id})`);
      } else {
        raw = (window._mockRecords?.[entity] || []).find(r => r[ent.primaryIdAttr] === id);
      }
      if (raw) _recordCache[`${entity}|${id}`] = raw;
    }
    if (!raw) { body.innerHTML = `<div class="lk-error">Record not found.</div>`; return; }
    // refine title with the real primary-name value if available
    const realTitle = recordTitle(entity, raw);
    if (realTitle) document.getElementById('lkTitle').textContent = realTitle;
    renderLookupBody(entity, raw);
  } catch(e) {
    body.innerHTML = `<div class="lk-error">Could not load record: ${esc(e.message)}</div>`;
  }
}

function renderLookupBody(entity, raw) {
  const body = document.getElementById('lkBody');
  const cols = (ENTITY_ATTRS[entity] || []).filter(a => a.type !== 'FileType' && a.type !== 'ImageType');
  let fields = cols.map(a => { const d = fieldDisplay(raw, a); return { attr:a, disp:d, empty:d.cls==='empty' }; });
  const emptyCount = fields.filter(f => f.empty).length;
  const filledCount = fields.length - emptyCount;
  const filter = _lkFieldFilter;
  if (filter === 'empty') fields = fields.filter(f => f.empty);
  else if (filter === 'filled') fields = fields.filter(f => !f.empty);

  let html = '';
  // Breadcrumb (when nested through multiple lookups)
  if (_lkStack.length > 1) {
    html += `<div class="lk-crumb"><span class="lk-back" onclick="lookupBack()">← Back</span> · ${_lkStack.map(s => esc(s.label||s.entity)).join(' › ')}</div>`;
  }
  html += `<div class="detail-section-title">Fields
    <span class="pill">${cols.length} total · ${filledCount} filled · ${emptyCount} empty</span>
    <span class="field-filter">
      <button class="ff-btn ${filter==='all'?'active':''}" onclick="setLookupFilter('all')">All</button>
      <button class="ff-btn ${filter==='filled'?'active':''}" onclick="setLookupFilter('filled')">Filled</button>
      <button class="ff-btn ${filter==='empty'?'active':''}" onclick="setLookupFilter('empty')">Empty</button>
    </span></div>`;
  html += '<div class="field-grid">';
  fields.forEach(f => {
    const typeShort = f.attr.type.replace('Type','');
    const isLookup = LOOKUP_TYPES.has(f.attr.type) && !f.empty;
    const rawId = isLookup ? raw[`_${f.attr.logicalName}_value`] : null;
    const targetEntity = f.attr.lookupTarget?.targetEntity;
    const valCls = f.disp.cls === 'lookup' ? 'lookup' : f.empty ? 'empty' : '';
    const valTxt = f.empty ? '(empty)' : esc(f.disp.text);
    let valueHtml;
    if (isLookup && rawId && targetEntity) {
      const lkIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M7 7h10v10"/></svg>`;
      valueHtml = `<span class="field-value lookup clickable" title="Open ${esc(targetEntity)} record" onclick="openLookupPanel('${esc(targetEntity)}','${esc(rawId)}','${esc(f.disp.text)}')">${valTxt}${lkIcon}</span>`;
    } else {
      valueHtml = `<div class="field-value ${valCls}">${valTxt}</div>`;
    }
    html += `<div class="field-cell ${f.empty?'is-empty':''}">
      <div class="field-label" title="${esc(f.attr.logicalName)}">${esc(f.attr.displayName)} <span class="ftype">${esc(typeShort)}</span></div>
      ${valueHtml}
    </div>`;
  });
  html += '</div>';
  body.innerHTML = html;
}

function setLookupFilter(mode) {
  _lkFieldFilter = mode;
  const top = _lkStack[_lkStack.length-1];
  if (!top) return;
  const raw = _recordCache[`${top.entity}|${top.id}`];
  if (raw) renderLookupBody(top.entity, raw);
}

function lookupBack() {
  if (_lkStack.length < 2) { closeLookupPanel(); return; }
  _lkStack.pop();
  const prev = _lkStack[_lkStack.length-1];
  openLookupPanel(prev.entity, prev.id, prev.label, true);
}

function closeLookupPanel() {
  document.getElementById('lookupPanelOverlay').classList.remove('open');
  _lkStack = [];
}

function setFieldFilter(path, mode) {
  _detailFieldFilter[path] = mode;
  const ctx = _pathRegistry[path];
  const el = document.getElementById(`detail-${cssId(path)}`);
  // Top-level node
  if (el && ctx && ctx.depth === 0) {
    const row = allRecords.find(r => r._id === ctx.id);
    if (row) { el.innerHTML = renderNode(currentEntity, row._raw, path, 0, null); loadNodeCounts(currentEntity, ctx.id, path, 0);
      // restore open subgrids
      restoreOpenDescendants(path); }
    return;
  }
  // Nested node: re-render inside its wrap
  const rowKey = cssId(path);
  const wrap = document.getElementById(`nestedwrap-${rowKey}`);
  if (wrap && ctx) {
    const raw = _recordCache[`${ctx.entity}|${ctx.id}`];
    if (raw) {
      const childEnt = ALL_ENTITIES.find(e => e.logicalName === ctx.entity);
      const crumb = [{ label: `${childEnt.displayName}: ${recordTitle(ctx.entity, raw)}` }];
      wrap.innerHTML = renderNode(ctx.entity, raw, path, ctx.depth, crumb);
      loadNodeCounts(ctx.entity, ctx.id, path, ctx.depth);
      restoreOpenDescendants(path);
    }
  }
}

// After a re-render, re-open any descendant subgrids/rows the user had open
async function restoreOpenDescendants(prefix) {
  const paths = Object.keys(_nodeOpen).filter(p => p.startsWith(prefix + '/') && _nodeOpen[p]);
  // Sort by depth (shorter paths first) so parents open before children
  paths.sort((a,b) => a.split('/').length - b.split('/').length);
  for (const p of paths) {
    const ctx = _pathRegistry[p];
    if (!ctx) continue;
    if (ctx.kind === 'subgrid') await openSubgrid(p);
    else if (ctx.kind === 'row') await openRow(p);
  }
}

function toggleExpand(id) {
  if (expandedId === id) {
    // collapsing: clear nested open-state for this record's subtree
    Object.keys(_nodeOpen).forEach(p => { if (p === id || p.startsWith(id + '/')) delete _nodeOpen[p]; });
    expandedId = null;
  } else {
    expandedId = id;
  }
  renderTable();
}

function updateFooter(total) {
  const maxPage = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > maxPage) currentPage = maxPage;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= maxPage;
  const start = total ? (currentPage-1)*PAGE_SIZE+1 : 0;
  const end = Math.min(total, currentPage*PAGE_SIZE);
  document.getElementById('pageInfo').textContent = total ? `${start}–${end} of ${total}` : '—';
}

function updateCount() {
  const el = document.getElementById('recordCount');
  if (!currentEntity || !allRecords.length) { el.innerHTML = ''; return; }
  const shown = getFilteredSorted().length;
  el.innerHTML = searchTerm ? `<strong>${shown}</strong> of ${allRecords.length} records` : `<strong>${allRecords.length}</strong> records`;
}

  if (custom.length) { const g = document.createElement('optgroup'); g.label = `Custom (${custom.length})`; custom.forEach(e => { const o = document.createElement('option'); o.value = e.logicalName; o.textContent = `${e.displayName} (${e.logicalName})`; g.appendChild(o); }); sel.appendChild(g); }
  if (system.length) { const g = document.createElement('optgroup'); g.label = `System (${system.length})`; system.forEach(e => { const o = document.createElement('option'); o.value = e.logicalName; o.textContent = `${e.displayName} (${e.logicalName})`; g.appendChild(o); }); sel.appendChild(g); }

async function changeEntity() {
  const v = document.getElementById('entitySelect').value;
  currentEntity = v;
  expandedId = null; sortCol = null; sortDir='asc'; currentPage = 1; searchTerm='';
  currentView = ''; _activeFilters = [];
  document.getElementById('searchInput').value = '';
  document.getElementById('viewSelect').innerHTML = '<option value="">All records</option>';
  document.getElementById('viewSelect').disabled = true;
  allRecords = []; displayCols = []; allCols = []; childRels = [];
  updateFilterButton();
  if (!v) { renderTable(); return; }
  // Need attributes loaded before views (for choice-value resolution in filters)
  await loadEntityAttributes(v);
  const views = await loadViews(v);

async function loadEntityData(ln) {
  if (_isLive) { await fetchRecords(ln); }
  else {
    showLoading('Loading…');
    await loadEntityAttributes(ln);
    childRels = await loadChildRelationships(ln);
    allCols = (ENTITY_ATTRS[ln]||[]).filter(a=>a.type!=='FileType'&&a.type!=='ImageType');
    displayCols = buildPrimaryColumns(ln);
    const entity = ALL_ENTITIES.find(e=>e.logicalName===ln);
    let recs = window._mockRecords?.[ln] || [];
    // Seed + apply view filters offline
    if (currentView && _viewsCache[ln]) {
      const view = _viewsCache[ln].find(v => v.id === currentView);
      if (view?.fetchxml) {
        const raw = parseViewFilters(view.fetchxml, ln);
        _activeFilters = resolveViewFilterValues(raw, ln);
      }
    }
    allRecords = recs.map(rec => {
      const id = rec[entity.primaryIdAttr];
      _recordCache[`${ln}|${id}`] = rec;
      const row = { _id: id, _raw: rec };
      displayCols.forEach(c => row[c.logicalName] = fieldDisplay(rec, c));
      return row;
    });
    currentPage=1; expandedId=null; updateFilterButton(); renderTable(); hideLoading();
    showStatus('warn', `Demo data — ${allRecords.length} records${currentView?' · view':''}`);
  }
}

function reloadData() {
  if (!currentEntity) return;
  delete ENTITY_ATTRS[currentEntity];
  delete _childRelCache[currentEntity];
  delete _viewsCache[currentEntity];
  Object.keys(_subgridCache).forEach(k => delete _subgridCache[k]);
  Object.keys(_lookupTargetCache).forEach(k => { if (k.startsWith(currentEntity+'.')) delete _lookupTargetCache[k]; });
  // Re-resolve views (the selected one may have changed) then reload
  loadEntityAttributes(currentEntity).then(() => loadViews(currentEntity)).then(views => {
    populateViewDropdown(views);
    if (currentView) document.getElementById('viewSelect').value = currentView;
    loadEntityData(currentEntity);
  });
}

// Offline mock subgrid fetch — filters mock child records by FK and stashes full records.
function fetchSubgridMock(recordId, rel, ck) {
  if (_subgridCache[ck]) return _subgridCache[ck];
  const all = window._mockRecords?.[rel.childEntity] || [];
  const childEntity = ALL_ENTITIES.find(e => e.logicalName === rel.childEntity);
  const cols = buildPrimaryColumns(rel.childEntity).slice(0,5);
  const rows = all.filter(r => r[`_${rel.fkField}_value`] === recordId).map(rec => {
    const id = rec[childEntity.primaryIdAttr];
    _recordCache[`${rel.childEntity}|${id}`] = rec;
    const row = { _id: id, _entity: rel.childEntity, _raw: rec, _cells:{} };
    cols.forEach(c => row._cells[c.logicalName] = fieldDisplay(rec, c));
    return row;
  });
  const result = { cols, rows, total: rows.length, childEntity: rel.childEntity };
  _subgridCache[ck] = result;
  return result;
}
